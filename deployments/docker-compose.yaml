services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  forecaster:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      MGF_REDIS__ENABLED: "true"
      MGF_REDIS__URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes:
      - ../artifacts:/app/artifacts          # trained model + forecast log
      - /home/xcurv/teep-taiwan/data:/data:ro # raw inputs (read-only)

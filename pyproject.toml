[project]
name = "microgrid-forecaster"
version = "0.1.0"
description = "Configurable-horizon PV and demand forecaster (Chronos-2 zero-shot) with an HTTP API and optional Redis publishing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xcurv" }]

dependencies = [
    # --- core forecasting stack (same as the notebook) ---
    "skforecast>=0.14",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",          # read .xlsx (PV / demand)
    # --- service layer (new for the live app) ---
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "apscheduler>=3.10",
    "redis>=5.0",
    "joblib>=1.3",           # artifact I/O
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",           # CLI
]

[project.optional-dependencies]
# Chronos-2 foundation backend. Heavy (pulls torch); required to train/serve
# the PV/demand forecaster. `chronos-forecasting` provides BaseChronosPipeline,
# which skforecast's ChronosAdapter loads for `autogluon/chronos-*` model ids.
foundation = [
    "chronos-forecasting>=1.5",
    "torch>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "fakeredis>=2.21",
    "httpx>=0.27",           # FastAPI TestClient
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
forecaster = "microgrid_forecaster.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microgrid_forecaster"]

# ---------------------------------------------------------------------------
# Tooling: one config block per tool, all in pyproject (single source of truth)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]  # pyflakes, isort, pyupgrade, bugbear, simplify

[tool.mypy]
python_version = "3.10"
packages = ["microgrid_forecaster"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=microgrid_forecaster"
